<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/editor.css">
  <script type="module" src="/js/editor.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="wordmark">Clip Studio</span>
    <nav class="pages" data-nav aria-label="Pages"></nav>
    <div class="source">
      <input type="text" id="urlInput" class="field" placeholder="Paste a YouTube, Twitch or Kick link" aria-label="Video link">
      <select id="loadModeSelect" class="field load-mode" aria-label="How to load the video"
        title="Download saves the whole video first. Stream reads it from the platform and saves only your clips.">
        <option value="download">Download</option>
        <option value="stream">Stream</option>
      </select>
      <button id="loadBtn" class="btn btn-primary">Load video</button>
      <button id="fetchCcTopBtn" class="btn">Get captions</button>
      <button id="clearBtn" class="btn" title="Clear the video, subtitles and moments">Clear</button>
    </div>
  </header>

  <main class="workspace">
    <section class="editor">
      <div class="clip-meta">
        <div id="videoMetaHeader" class="video-meta" hidden>
          <span id="videoTitleDisplay"></span>
          <span id="videoPlatformDisplay" class="video-platform"></span>
          <span id="videoDurationDisplay">00:00</span>
        </div>
        <div id="loadStatus" class="status-msg">Ready</div>
      </div>
      <p id="loadError" class="load-error" role="alert" hidden></p>

      <div class="video-viewport" id="viewport">
        <div class="placeholder-view" id="placeholderView">
          <p>Paste a YouTube, Twitch or Kick link above to start clipping.</p>
        </div>
        <video id="videoPlayer" controls hidden></video>
      </div>

      <div class="timeline" id="timelineContainer">
        <div class="timeline-lane">
          <div class="timeline-range-fill" id="rangeFill"></div>
          <div class="playhead-marker" id="playheadMarker"></div>
        </div>
        <input type="range" id="startSlider" class="range-input" min="0" max="100" step="0.1" value="0" aria-label="In point">
        <input type="range" id="endSlider" class="range-input" min="0" max="100" step="0.1" value="100" aria-label="Out point">
      </div>

      <div class="readout">
        <div class="readout-cell">
          <span class="readout-label">In</span>
          <span id="startTimeVal" class="timecode">00:00.0</span>
        </div>
        <div class="readout-cell">
          <span class="readout-label">Out</span>
          <span id="endTimeVal" class="timecode">00:00.0</span>
        </div>
        <div class="readout-cell">
          <span class="readout-label">Length</span>
          <span id="clipDurationPill" class="timecode timecode-length">00:00.0</span>
        </div>
      </div>

      <div class="transport">
        <div class="button-group">
          <button id="setStartBtn" class="btn" title="Move the in point to the playhead">Set in</button>
          <button id="setEndBtn" class="btn" title="Move the out point to the playhead">Set out</button>
          <button id="stepBackBtn" class="btn" aria-label="Step back 0.1 seconds">−0.1s</button>
          <button id="stepForwardBtn" class="btn" aria-label="Step forward 0.1 seconds">+0.1s</button>
          <button id="previewClipBtn" class="btn">Play range</button>
          <button id="resetRangeBtn" class="btn">Reset</button>
        </div>
        <div class="export-group">
          <label class="send-to">
            <span class="field-label">Then send to</span>
            <select id="sendToSelect" class="field field-sm">
              <option value="">Nothing, just download</option>
            </select>
          </label>
          <button id="exportBtn" class="btn btn-primary" disabled>Export clip</button>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="tabs-nav">
        <button class="tab-btn active" data-tab="highlights">Highlights</button>
        <button class="tab-btn" data-tab="captions">Transcript</button>
      </div>

      <div id="highlightsTab" class="tab-content" data-tab-panel="highlights">
        <div class="ai-form">
          <div class="ai-pair">
            <label class="ai-field">
              <span class="field-label">AI provider</span>
              <select id="aiProviderSelect" class="field field-sm">
                <option value="auto">Automatic</option>
              </select>
            </label>
            <label class="ai-field" id="aiModelRow" hidden>
              <span class="field-label">Model</span>
              <input type="text" id="aiModelInput" class="field field-sm" autocomplete="off" spellcheck="false">
            </label>
          </div>
          <div class="ai-field" id="aiKeyRow" hidden>
            <label class="field-label" for="geminiApiKey">API key</label>
            <input type="password" id="geminiApiKey" class="field field-sm" autocomplete="off" placeholder="API key">
          </div>
          <label class="ai-field" id="aiBaseUrlRow" hidden>
            <span class="field-label">Base URL</span>
            <input type="url" id="aiBaseUrlInput" class="field field-sm" autocomplete="off" spellcheck="false">
          </label>
          <div class="ai-remember" id="aiRememberRow" hidden>
            <label class="check"><input type="checkbox" id="aiRememberInput" checked> Remember on this computer</label>
            <button type="button" id="aiForgetBtn" class="btn btn-sm" hidden>Forget saved settings</button>
          </div>
          <p id="aiProviderHint" class="hint"></p>
          <div class="ai-field">
            <label class="field-label" for="aiQueryInput">Look for</label>
            <div class="analyze-row">
              <input type="text" id="aiQueryInput" class="field field-sm" placeholder="e.g. the moment they talk about pricing">
              <button id="aiAnalyzeBtn" class="btn btn-sm" disabled>Find moments</button>
            </div>
          </div>
        </div>

        <p id="aiAnswered" class="ai-answered" hidden></p>
        <div id="highlightsList" class="highlight-list">
          <p class="empty">Load a video to find moments worth clipping.</p>
        </div>
      </div>

      <div id="captionsTab" class="tab-content" data-tab-panel="captions" hidden>
        <input type="text" id="searchCaptionsInput" class="field field-sm" placeholder="Search transcript" aria-label="Search transcript">
        <div id="captionsList" class="caption-list">
          <p class="empty">The transcript appears here after you load a video.</p>
        </div>
      </div>
    </aside>
  </main>
</body>
</html>
